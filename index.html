<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d141d" media="(prefers-color-scheme: dark)">
  <title>Today's Lunch Order</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍱%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <h1>Today's Lunch Order</h1>
    <p class="date" id="today-date">Loading…</p>

    <noscript><p class="error">Please turn on JavaScript to see the lunch order.</p></noscript>

    <div class="error" id="error" hidden>
      <p>The lunch order could not be loaded. Check your internet connection and try again.</p>
      <button class="btn" type="button" id="retry-btn">Try again</button>
    </div>

    <div id="today-groups"></div>

    <div class="actions">
      <button class="btn" type="button" id="tomorrow-btn"
              aria-expanded="false" aria-controls="tomorrow" hidden>Show Tomorrow's Order</button>
    </div>

    <section id="tomorrow" hidden>
      <div class="panel">
        <h2>Tomorrow's Order <span class="preview-tag">Preview</span></h2>
        <p class="date" id="tomorrow-date"></p>
        <div id="tomorrow-groups"></div>
      </div>
    </section>

    <div class="actions">
      <a class="btn secondary" href="history.html">History</a>
    </div>

  </main>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
