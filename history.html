<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d141d" media="(prefers-color-scheme: dark)">
  <title>Lunch Order History</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍱%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <a class="back" href="index.html">← Today's Order</a>
    <h1>History</h1>

    <noscript><p class="error">Please turn on JavaScript to see the history.</p></noscript>

    <div class="actions">
      <button class="btn" type="button" id="yesterday-btn">Yesterday</button>
    </div>

    <div class="field">
      <label for="date-picker">Select a Date</label>
      <input type="date" id="date-picker">
    </div>

    <div id="results" aria-live="polite"><p class="muted">Loading…</p></div>

    <div class="actions">
      <button class="btn secondary" type="button" id="latest-btn" hidden>Show latest days</button>
    </div>

  </main>

  <script src="common.js"></script>
  <script src="history.js"></script>
</body>
</html>
